name: Build and push the Docker images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux
          - win
    steps:
      - name: Install just
        uses: taiki-e/install-action@6d97d0d47ea06f0bb4e81bc7911476e7cc61b312 # just

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to the container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # An owner that cannot name a registry image gets a local one (see
      # tools/docker/image_tag); the workflow then only checks that it
      # builds.
      - name: Build and push the image
        run: |
          just image-${{ matrix.platform }}
          case "$(tools/docker/image_tag ${{ matrix.platform }})" in
            */*) just push-image-${{ matrix.platform }} ;;
            *) echo "::notice::Built a local image; this owner has no registry to push it to." ;;
          esac
