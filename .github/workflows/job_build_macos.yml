name: Build and package for macOS

on:
  workflow_call:
    inputs:
      target:
        type: string
        description: "Build type: debug or release"
        required: true
      release:
        type: boolean
        description: "Build a release, whose version has no -dev suffix"
        default: false
      packages:
        type: string
        description: "What to package: games, othpatch or all"
        default: all
      release_index_url:
        type: string
        description: "URL of the release index that gives the othpatch of the game packages; empty for the build option releases_url"
        default: ""

jobs:
  build:
    name: Build (mac, ${{ inputs.target }})
    runs-on: macos-15
    permissions:
      contents: read
    env:
      OPENTOUHOU_WERROR: 1

    steps:
      - name: Install the build tools
        run: brew install meson ninja pkgconf

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The dependencies change only with their script, the pins or the
      # options of the Linux images, so they are built once per change.
      - name: Restore the dependencies
        id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/mac-deps
          key: mac-deps-v2-${{ hashFiles('tools/mac/build_deps', 'tools/docker/pins', 'tools/docker/linux/*/Dockerfile') }}

      - name: Build the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: tools/mac/build deps

      - name: Build and package
        env:
          RELEASES_URL: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json', vars.R2_PUBLIC_URL) || '' }}
          OPENTOUHOU_RELEASE: ${{ inputs.release && '1' || '' }}
          RELEASE_INDEX_URL: ${{ inputs.release_index_url }}
          PACKAGES: ${{ inputs.packages }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$PACKAGES" in
            games|all) tools/mac/build package --target "$TARGET" ;;
          esac
          case "$PACKAGES" in
            othpatch|all) tools/mac/build package-othpatch --target "$TARGET" ;;
          esac

      # A pull request uploads each package as its own artifact, unzipped,
      # so that its comment links each file. The name gains the target,
      # because the debug and release builds name their files the same.
      - name: Name the packages for the pull request
        id: pr
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p build/pr
          for file in build/packages/*; do
            base=$(basename "$file")
            case "$base" in
              *.zip) out="${base%.zip}-$TARGET.zip" ;;
              *.exe) out="${base%.exe}-$TARGET.exe" ;;
              *) out="$base-$TARGET" ;;
            esac
            cp "$file" "build/pr/$out"
            echo "${base%%-*}=build/pr/$out" >> "$GITHUB_OUTPUT"
          done

      - name: Upload oth06 for the pull request
        if: ${{ steps.pr.outputs.oth06 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.pr.outputs.oth06 }}
          archive: false
          retention-days: 14

      - name: Upload othpatch for the pull request
        if: ${{ steps.pr.outputs.othpatch }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.pr.outputs.othpatch }}
          archive: false
          retention-days: 14

      - name: Upload the packages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ inputs.packages }}-mac-${{ inputs.target }}
          path: build/packages/
          compression-level: 0

  test:
    name: Test (mac, ${{ inputs.target }})
    runs-on: macos-15
    permissions:
      contents: read
    env:
      OPENTOUHOU_WERROR: 1

    steps:
      - name: Install the build tools
        run: brew install meson ninja pkgconf

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The dependencies change only with their script, the pins or the
      # options of the Linux images, so they are built once per change.
      - name: Restore the dependencies
        id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/mac-deps
          key: mac-deps-v2-${{ hashFiles('tools/mac/build_deps', 'tools/docker/pins', 'tools/docker/linux/*/Dockerfile') }}

      - name: Build the dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: tools/mac/build deps

      - name: Run the unit tests
        run: tools/mac/build test
