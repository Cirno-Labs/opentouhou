# Pins the patched DOSBox-X of the dosbox backend: a PC-98 with a 386 and
# an FPU on the normal core, at fixed cycles and full speed, with no sound
# output and no disk delays. Emulated time follows the cycles, not the host
# clock. CPU speed determines how much emulated time the game's work takes
# and can change timer-dependent behavior. The launcher appends [autoexec].

[sdl]
output = surface
showmenu = false
waitonerror = false
autolock = false

[dosbox]
machine = pc98
fastbioslogo = true
startbanner = false
quit warning = false

[pc98]
pc-98 time stamp = true
pc-98 buffer page flip = false

[cpu]
core = normal
cputype = 386
fpu = true
cycles = fixed 100000
turbo = true
stop turbo on key = false

[mixer]
nosound = true

[dos]
hard drive data rate limit = 0
