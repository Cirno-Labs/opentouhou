default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
- repo: local
  hooks:
  - id: clang-format
    name: clang-format
    entry: clang-format
    args: ["-style=file", "-i"]
    language: python
    additional_dependencies: [clang-format==22.1.8]
    files: \.[ch]$

  - id: commit-msg
    name: Commit message has a module prefix and follows 50/72
    entry: tools/lint/check_commit_msg
    language: python
    stages: [commit-msg]

  - id: check-versions
    name: Version files hold versions that the changelogs have
    entry: tools/lint/check_versions
    language: python
    pass_filenames: false
    always_run: true

  - id: check-changelog
    name: Changelogs keep their format and their released sections
    entry: tools/lint/check_changelog
    language: python
    files: ^docs/[^/]+/CHANGELOG\.md$

  - id: check-spdx-c
    name: C sources start with the SPDX licence line
    entry: tools/lint/check_spdx
    language: python
    files: ^(src|tests|replay)/.*\.[ch]$
    exclude: ^src/core/math/libm/[a-z0-9_]+(\.c|_internal\.h)$

  - id: check-spdx-scripts
    name: Scripts start with the SPDX licence line
    entry: tools/lint/check_spdx
    language: python
    types_or: [python, shell]

  - id: actionlint
    name: actionlint
    entry: actionlint
    language: python
    additional_dependencies: [actionlint-py==1.7.12.25, shellcheck-py==0.11.0.1]
    files: ^\.github/workflows/.*\.ya?ml$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.5
  hooks:
  - id: ruff-check
    files: ^(tools|tests/tools)/
  - id: ruff-format
    files: ^(tools|tests/tools)/
