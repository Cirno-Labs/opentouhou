name: Publish a development snapshot

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: read

# A newer push replaces the snapshot, so an older run has nothing to add.
concurrency:
  group: prerelease
  cancel-in-progress: true

jobs:
  build_linux:
    name: Linux
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: release

  build_win:
    name: Windows
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: release

  publish:
    name: Publish
    needs:
      - build_linux
      - build_win
    runs-on: ubuntu-latest
    steps:
      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages/
          merge-multiple: true

      - name: Replace the latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Development snapshot" \
            --notes "Built from ${{ github.sha }} on develop." \
            packages/*
