name: Build and package

on:
  workflow_call:
    inputs:
      platform:
        type: string
        description: "Platform to build for: linux or win"
        required: true
      target:
        type: string
        description: "Build type: debug or release"
        required: true
      release:
        type: boolean
        description: "Build a release, whose version has no -dev suffix"
        default: false
      packages:
        type: string
        description: "What to package: games, othpatch or all"
        default: all
      release_index_url:
        type: string
        description: "URL of the release index that gives the othpatch of the game packages; empty for the build option releases_url"
        default: ""

jobs:
  build:
    name: Build (${{ inputs.platform }}, ${{ inputs.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OPENTOUHOU_WERROR: 1

    steps:
      - name: Install just
        uses: taiki-e/install-action@6d97d0d47ea06f0bb4e81bc7911476e7cc61b312 # just

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to the container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The games build in the media image and othpatch in the othpatch
      # image, both built on the base image. Packaging the games builds
      # othpatch too, for a pinned othpatch without a release. An owner
      # without a registry (see tools/docker/image) keeps each local image
      # in the Actions cache, keyed by its tag, so that only a change to
      # an image builds it again. The base image is restored only to build
      # a child.
      - name: Find the images
        id: image
        env:
          PACKAGES: ${{ inputs.packages }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          for image in base media othpatch; do
            echo "$image=$(tools/docker/image tag $PLATFORM $image)" >> "$GITHUB_OUTPUT"
          done
          case "$(tools/docker/image tag $PLATFORM base)" in
            */*) echo "local=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "local=true" >> "$GITHUB_OUTPUT" ;;
          esac
          case "$PACKAGES" in
            games|all) echo "media_needed=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "othpatch_needed=true" >> "$GITHUB_OUTPUT"

      - name: Restore the media image
        id: media-cache
        if: ${{ steps.image.outputs.local == 'true' && steps.image.outputs.media_needed == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/media.tar.zst
          key: image-v2-${{ steps.image.outputs.media }}

      - name: Restore the othpatch image
        id: othpatch-cache
        if: ${{ steps.image.outputs.local == 'true' && steps.image.outputs.othpatch_needed == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/othpatch.tar.zst
          key: image-v2-${{ steps.image.outputs.othpatch }}

      - name: Restore the base image
        id: base-cache
        if: ${{ (steps.media-cache.outcome == 'success' && steps.media-cache.outputs.cache-hit != 'true') || (steps.othpatch-cache.outcome == 'success' && steps.othpatch-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/base.tar.zst
          key: image-v2-${{ steps.image.outputs.base }}

      - name: Load the images
        if: ${{ steps.image.outputs.local == 'true' }}
        run: |
          for file in .cache/images/*.tar.zst; do
            if [ -e "$file" ]; then
              zstd -dc "$file" | docker load
            fi
          done

      # A pull request restores the shared ccache read-only and never writes
      # it back (see the Save step), so a branch cannot poison the cache that
      # a later main build uses.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ccache
          key: ccache-v2-${{ inputs.platform }}-${{ inputs.packages }}-${{ inputs.target }}-${{ hashFiles('justfile', 'tools/docker/pins', 'tools/docker/*/*/Dockerfile', 'tools/docker/win/meson_cross_x86_64.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ inputs.platform }}-${{ inputs.packages }}-${{ inputs.target }}-${{ hashFiles('justfile', 'tools/docker/pins', 'tools/docker/*/*/Dockerfile', 'tools/docker/win/meson_cross_x86_64.txt') }}-

      - name: Build and package
        env:
          CCACHE_MAXSIZE: 1G
          RELEASES_URL: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json', vars.R2_PUBLIC_URL) || '' }}
          OPENTOUHOU_RELEASE: ${{ inputs.release && '1' || '' }}
          RELEASE_INDEX_URL: ${{ inputs.release_index_url }}
          PACKAGES: ${{ inputs.packages }}
          PLATFORM: ${{ inputs.platform }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$PACKAGES" in
            games|all) just package-$PLATFORM $TARGET ;;
          esac
          case "$PACKAGES" in
            othpatch|all) just package-othpatch-$PLATFORM $TARGET ;;
          esac

      - name: Run the unit tests
        if: ${{ inputs.platform == 'linux' }}
        env:
          RELEASES_URL: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json', vars.R2_PUBLIC_URL) || '' }}
          PACKAGES: ${{ inputs.packages }}
        run: just test "$PACKAGES"

      - name: Save ccache
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # Each image that this job built is saved in its own cache entry.
      - name: Pack the images
        id: pack
        if: ${{ steps.image.outputs.local == 'true' && github.event_name != 'pull_request' }}
        env:
          BASE_MISSED: ${{ steps.base-cache.outcome == 'success' && steps.base-cache.outputs.cache-hit != 'true' }}
          MEDIA_MISSED: ${{ steps.media-cache.outcome == 'success' && steps.media-cache.outputs.cache-hit != 'true' }}
          OTHPATCH_MISSED: ${{ steps.othpatch-cache.outcome == 'success' && steps.othpatch-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p .cache/images
          pack() {
            docker save "$2" | zstd -T0 -3 -f -o ".cache/images/$1.tar.zst"
            echo "$1=true" >> "$GITHUB_OUTPUT"
          }
          if [ "$BASE_MISSED" = true ]; then pack base "${{ steps.image.outputs.base }}"; fi
          if [ "$MEDIA_MISSED" = true ]; then pack media "${{ steps.image.outputs.media }}"; fi
          if [ "$OTHPATCH_MISSED" = true ]; then pack othpatch "${{ steps.image.outputs.othpatch }}"; fi

      - name: Save the base image
        if: ${{ steps.pack.outputs.base == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/base.tar.zst
          key: ${{ steps.base-cache.outputs.cache-primary-key }}

      - name: Save the media image
        if: ${{ steps.pack.outputs.media == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/media.tar.zst
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

      - name: Save the othpatch image
        if: ${{ steps.pack.outputs.othpatch == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/othpatch.tar.zst
          key: ${{ steps.othpatch-cache.outputs.cache-primary-key }}

      - name: Upload the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ inputs.packages }}-${{ inputs.platform }}-${{ inputs.target }}
          path: build/packages/
          compression-level: 0
