name: Publish the releases

# Publishes each program whose src/<program>/version.txt names a
# version that the release index in the R2 bucket does not have:
# othpatch first, then the games, whose packages take the othpatch that
# they ship from the index. Each publish uploads the files, adds the
# release to the index and pushes the tag <product>-vX.Y.Z, such as
# oth06-v1.2.0, that tools/release_index tag names. With
# replace, a version published less than 24 hours ago is published
# again: its files and its index entry are replaced, and its tag moves
# to the commit of the run.
on:
  workflow_dispatch:
    inputs:
      replace:
        description: Replace the versions published less than 24 hours ago
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: release

# The jobs that read or write the bucket take its secrets from the
# environment release.
jobs:
  branch:
    name: Check the branch
    runs-on: ubuntu-latest
    steps:
      - name: Check that the run is on main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::This workflow runs only on main, not on $GITHUB_REF. Run it with --ref main."
            exit 1
          fi

  plan:
    name: Plan
    needs: branch
    runs-on: ubuntu-latest
    environment: release
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    outputs:
      othpatch: ${{ steps.plan.outputs.othpatch }}
      games: ${{ steps.plan.outputs.games }}
    steps:
      - name: Check the settings
        run: |
          for name in R2_ACCOUNT_ID R2_BUCKET R2_PUBLIC_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is empty. Set the repository variables R2_ACCOUNT_ID, R2_BUCKET and R2_PUBLIC_URL and the secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY of the environment release."
              exit 1
            fi
          done

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find the versions without a release
        id: plan
        env:
          REPLACE: ${{ inputs.replace && '1' || '' }}
        run: |
          tools/release_index fetch releases.json
          tools/release_plan --index releases.json ${REPLACE:+--replace} | tee -a "$GITHUB_OUTPUT"

  othpatch_linux:
    name: othpatch, Linux
    needs: plan
    if: needs.plan.outputs.othpatch != ''
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: release
      release: true
      packages: othpatch

  othpatch_win:
    name: othpatch, Windows
    needs: plan
    if: needs.plan.outputs.othpatch != ''
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: release
      release: true
      packages: othpatch

  othpatch_mac:
    name: othpatch, macOS
    needs: plan
    if: needs.plan.outputs.othpatch != ''
    uses: ./.github/workflows/job_build_macos.yml
    with:
      target: release
      release: true
      packages: othpatch

  othpatch:
    name: Publish othpatch
    needs:
      - plan
      - othpatch_linux
      - othpatch_win
      - othpatch_mac
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    # Every job that writes the index is in this group, so that two
    # writes never overlap.
    concurrency:
      group: release-index
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages/
          pattern: packages-othpatch-*
          merge-multiple: true

      - name: Publish the files and the index
        env:
          VERSION: ${{ needs.plan.outputs.othpatch }}
          REPLACE: ${{ inputs.replace && '1' || '' }}
        run: tools/release_index publish --program othpatch --version "$VERSION" --packages packages ${REPLACE:+--replace}

      - name: Push the tag
        env:
          VERSION: ${{ needs.plan.outputs.othpatch }}
          REPLACE: ${{ inputs.replace && '1' || '' }}
        run: |
          tag="$(tools/release_index tag othpatch "$VERSION")"
          git tag ${REPLACE:+--force} "$tag" "$GITHUB_SHA"
          git push ${REPLACE:+--force} origin "refs/tags/$tag"

  # A game job runs when the othpatch jobs succeeded or were skipped. The
  # packages read the index from the bucket, which has the new othpatch
  # as soon as its job publishes it.
  games_linux:
    name: Games, Linux
    needs:
      - plan
      - othpatch
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.games != '' }}
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: release
      release: true
      packages: games
      release_index_url: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json?run={1}-{2}', vars.R2_PUBLIC_URL, github.run_id, github.run_attempt) || '' }}

  games_win:
    name: Games, Windows
    needs:
      - plan
      - othpatch
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.games != '' }}
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: release
      release: true
      packages: games
      release_index_url: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json?run={1}-{2}', vars.R2_PUBLIC_URL, github.run_id, github.run_attempt) || '' }}

  games_mac:
    name: Games, macOS
    needs:
      - plan
      - othpatch
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.games != '' }}
    uses: ./.github/workflows/job_build_macos.yml
    with:
      target: release
      release: true
      packages: games
      release_index_url: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json?run={1}-{2}', vars.R2_PUBLIC_URL, github.run_id, github.run_attempt) || '' }}

  games:
    name: Publish the games
    needs:
      - plan
      - games_linux
      - games_win
      - games_mac
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.games != '' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    concurrency:
      group: release-index
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages/
          pattern: packages-games-*
          merge-multiple: true

      - name: Publish the files, the index and the tags
        env:
          GAMES: ${{ needs.plan.outputs.games }}
          REPLACE: ${{ inputs.replace && '1' || '' }}
        run: |
          for game in $GAMES; do
            version="$(cat "src/$game/version.txt")"
            tools/release_index publish --program "$game" --version "$version" --packages packages ${REPLACE:+--replace}
            tag="$(tools/release_index tag "$game" "$version")"
            git tag ${REPLACE:+--force} "$tag" "$GITHUB_SHA"
            git push ${REPLACE:+--force} origin "refs/tags/$tag"
          done
