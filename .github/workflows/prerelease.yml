name: Publish a development snapshot

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  packages: read

# A newer push replaces the snapshot, so an older run has nothing to add.
concurrency:
  group: prerelease
  cancel-in-progress: true

# Publishing stays off until the repository variable PRERELEASE_ENABLE
# is set to true.
jobs:
  build_linux:
    name: Linux
    if: vars.PRERELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: release

  build_win:
    name: Windows
    if: vars.PRERELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: release

  build_mac:
    name: macOS
    if: vars.PRERELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build_macos.yml
    with:
      target: release

  publish:
    name: Publish
    needs:
      - build_linux
      - build_win
      - build_mac
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages/
          merge-multiple: true

      - name: Replace the latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tools/release_notes --repository "$GH_REPO" --tag latest \
            --packages packages --commit "${{ github.sha }}" > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Development snapshot" \
            --notes-file notes.md \
            packages/*
