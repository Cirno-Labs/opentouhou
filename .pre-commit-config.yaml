default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
- repo: local
  hooks:
  - id: clang-format
    name: clang-format
    entry: clang-format
    args: ["-style=file", "-i"]
    language: python
    additional_dependencies: [clang-format==22.1.8]
    files: \.[ch]$

  - id: header-spacing
    name: A commented function in a header has a blank line above it
    entry: tools/lint/check_header_spacing
    language: python
    files: \.h$

  - id: header-order
    name: A header declares its types before its functions
    entry: tools/lint/check_header_order
    language: python
    files: \.h$
    exclude: ^src/pc98/opna/vendor/

  - id: global-reset
    name: A global is reset with memset, not a compound literal
    entry: tools/lint/check_global_reset
    language: python
    files: ^(src|tests)/.*\.[ch]$

  - id: md-wrap
    name: Markdown wraps at 80 columns
    entry: tools/lint/check_md_wrap
    language: python
    files: \.md$

  - id: raw-color
    name: A color is written with COLOR_ARGB, not a raw literal
    entry: tools/lint/check_raw_color
    language: python
    files: ^(src/th0[67]/|tests/(test_)?th0[67]).*\.[ch]$

  - id: commit-msg
    name: Commit message has a module prefix and follows 50/72
    entry: tools/lint/check_commit_msg
    language: python
    stages: [commit-msg]

  - id: check-versions
    name: Version files hold versions that the changelogs have
    entry: tools/lint/check_versions
    language: python
    pass_filenames: false
    always_run: true

  - id: check-changelog
    name: Changelogs keep their format and their released sections
    entry: tools/lint/check_changelog
    language: python
    files: ^docs/[^/]+/CHANGELOG\.md$

  - id: actionlint
    name: actionlint
    entry: actionlint
    language: python
    additional_dependencies: [actionlint-py==1.7.12.25, shellcheck-py==0.11.0.1]
    files: ^\.github/workflows/.*\.ya?ml$

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.5
  hooks:
  - id: ruff-check
    files: ^(tools|tests/tools)/
  - id: ruff-format
    files: ^(tools|tests/tools)/
