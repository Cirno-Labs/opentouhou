name: Build a pull request

# Keep the trigger on `pull_request`, never `pull_request_target`. On a fork
# pull request, `pull_request` runs with a read-only token and no secrets.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A new push to a pull request cancels the builds of its older commits.
concurrency:
  group: pr-builds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install prek
        run: pipx install prek==0.2.24

      - name: Run the checks
        run: |
          prek -a || { git diff; exit 1; }

  build_linux:
    name: Linux
    strategy:
      fail-fast: false
      matrix:
        target:
          - debug
          - release
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: ${{ matrix.target }}

  build_win:
    name: Windows
    strategy:
      fail-fast: false
      matrix:
        target:
          - debug
          - release
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: ${{ matrix.target }}

  build_mac:
    name: macOS
    strategy:
      fail-fast: false
      matrix:
        target:
          - debug
          - release
    uses: ./.github/workflows/job_build_macos.yml
    with:
      target: ${{ matrix.target }}
