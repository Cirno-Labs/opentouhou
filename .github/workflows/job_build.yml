name: Build and package

on:
  workflow_call:
    inputs:
      platform:
        type: string
        description: "Platform to build for: linux or win"
        required: true
      target:
        type: string
        description: "Build type: debug or release"
        required: true
      release:
        type: boolean
        description: "Build a release, whose version has no -dev suffix"
        default: false
      packages:
        type: string
        description: "What to package: games, othpatch or all"
        default: all
      release_index_url:
        type: string
        description: "URL of the release index that gives the othpatch of the game packages; empty for the build option releases_url"
        default: ""

jobs:
  build:
    name: Build (${{ inputs.platform }}, ${{ inputs.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      OPENTOUHOU_WERROR: 1

    steps:
      - name: Install just
        uses: taiki-e/install-action@6d97d0d47ea06f0bb4e81bc7911476e7cc61b312 # just

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to the container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The games build in the media image and othpatch in the othpatch
      # image, both built on the base image. Packaging the games builds
      # othpatch too, for a pinned othpatch without a release. An owner
      # without a registry (see tools/docker/image) keeps each local image
      # in the Actions cache, keyed by its tag, so that only a change to
      # an image builds it again. The base image is restored only to build
      # a child.
      - name: Find the images
        id: image
        env:
          PACKAGES: ${{ inputs.packages }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          for image in base media othpatch; do
            echo "$image=$(tools/docker/image tag "$PLATFORM" "$image")" >> "$GITHUB_OUTPUT"
          done
          case "$(tools/docker/image tag "$PLATFORM" base)" in
            */*) echo "local=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "local=true" >> "$GITHUB_OUTPUT" ;;
          esac
          case "$PACKAGES" in
            games|all) echo "media_needed=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "othpatch_needed=true" >> "$GITHUB_OUTPUT"

      - name: Restore the media image
        id: media-cache
        if: ${{ steps.image.outputs.local == 'true' && steps.image.outputs.media_needed == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/media.tar.zst
          key: image-v2-${{ steps.image.outputs.media }}

      - name: Restore the othpatch image
        id: othpatch-cache
        if: ${{ steps.image.outputs.local == 'true' && steps.image.outputs.othpatch_needed == 'true' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/othpatch.tar.zst
          key: image-v2-${{ steps.image.outputs.othpatch }}

      - name: Restore the base image
        id: base-cache
        if: ${{ (steps.media-cache.outcome == 'success' && steps.media-cache.outputs.cache-hit != 'true') || (steps.othpatch-cache.outcome == 'success' && steps.othpatch-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/base.tar.zst
          key: image-v2-${{ steps.image.outputs.base }}

      - name: Load the images
        if: ${{ steps.image.outputs.local == 'true' }}
        run: |
          for file in .cache/images/*.tar.zst; do
            if [ -e "$file" ]; then
              zstd -dc "$file" | docker load
            fi
          done

      # A pull request restores the shared ccache read-only and never writes
      # it back (see the Save step), so a branch cannot poison the cache that
      # a later main build uses.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ccache
          key: ccache-v2-${{ inputs.platform }}-${{ inputs.packages }}-${{ inputs.target }}-${{ hashFiles('justfile', 'tools/docker/pins', 'tools/docker/*/*/Dockerfile', 'tools/docker/win/meson_cross_x86_64.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ inputs.platform }}-${{ inputs.packages }}-${{ inputs.target }}-${{ hashFiles('justfile', 'tools/docker/pins', 'tools/docker/*/*/Dockerfile', 'tools/docker/win/meson_cross_x86_64.txt') }}-

      - name: Build and package
        env:
          CCACHE_MAXSIZE: 1G
          RELEASES_URL: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json', vars.R2_PUBLIC_URL) || '' }}
          OPENTOUHOU_RELEASE: ${{ inputs.release && '1' || '' }}
          RELEASE_INDEX_URL: ${{ inputs.release_index_url }}
          PACKAGES: ${{ inputs.packages }}
          PLATFORM: ${{ inputs.platform }}
          TARGET: ${{ inputs.target }}
        run: |
          case "$PACKAGES" in
            games|all) just "package-$PLATFORM" "$TARGET" ;;
          esac
          case "$PACKAGES" in
            othpatch|all) just "package-othpatch-$PLATFORM" "$TARGET" ;;
          esac

      # The Windows unit tests build here and run in the job test, on
      # Windows. The upload holds the test list and the executables of each
      # build directory, at their paths in the repository. The executables
      # lose their symbols and go into one zstd archive with a long window:
      # each one holds the same libraries, so the archive is about a seventh
      # of a zip of them.
      - name: Build the Windows unit tests
        if: ${{ inputs.platform == 'win' }}
        env:
          RELEASES_URL: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json', vars.R2_PUBLIC_URL) || '' }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          just build-win-tests "$PACKAGES"
          stage=build/win-tests
          for dir in build/win/debug build/win/othpatch/debug; do
            if [ -e "$dir/meson-info/intro-tests.json" ]; then
              mkdir -p "$stage/$dir/meson-info" "$stage/$dir/tests"
              cp "$dir/meson-info/meson-info.json" "$dir/meson-info/intro-tests.json" "$stage/$dir/meson-info/"
              for exe in "$dir"/tests/*.exe; do
                strip --strip-all -o "$stage/$exe" "$exe"
              done
            fi
          done
          tar -C "$stage" -cf - . | zstd -15 --long=27 -T0 -q -o build/win-tests.tar.zst

      - name: Upload the Windows unit tests
        if: ${{ inputs.platform == 'win' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-tests-${{ inputs.packages }}-${{ inputs.target }}
          path: build/win-tests.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Save ccache
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      # Each image that this job built is saved in its own cache entry.
      - name: Pack the images
        id: pack
        if: ${{ steps.image.outputs.local == 'true' && github.event_name != 'pull_request' }}
        env:
          BASE_MISSED: ${{ steps.base-cache.outcome == 'success' && steps.base-cache.outputs.cache-hit != 'true' }}
          MEDIA_MISSED: ${{ steps.media-cache.outcome == 'success' && steps.media-cache.outputs.cache-hit != 'true' }}
          OTHPATCH_MISSED: ${{ steps.othpatch-cache.outcome == 'success' && steps.othpatch-cache.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p .cache/images
          pack() {
            docker save "$2" | zstd -T0 -3 -f -o ".cache/images/$1.tar.zst"
            echo "$1=true" >> "$GITHUB_OUTPUT"
          }
          if [ "$BASE_MISSED" = true ]; then pack base "${{ steps.image.outputs.base }}"; fi
          if [ "$MEDIA_MISSED" = true ]; then pack media "${{ steps.image.outputs.media }}"; fi
          if [ "$OTHPATCH_MISSED" = true ]; then pack othpatch "${{ steps.image.outputs.othpatch }}"; fi

      - name: Save the base image
        if: ${{ steps.pack.outputs.base == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/base.tar.zst
          key: ${{ steps.base-cache.outputs.cache-primary-key }}

      - name: Save the media image
        if: ${{ steps.pack.outputs.media == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/media.tar.zst
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

      - name: Save the othpatch image
        if: ${{ steps.pack.outputs.othpatch == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/images/othpatch.tar.zst
          key: ${{ steps.othpatch-cache.outputs.cache-primary-key }}

      # A pull request uploads each package as its own artifact, unzipped,
      # so that its comment links each file. The name gains the target,
      # because the debug and release builds name their files the same.
      - name: Name the packages for the pull request
        id: pr
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          mkdir -p build/pr
          for file in build/packages/*; do
            base=$(basename "$file")
            case "$base" in
              *.zip) out="${base%.zip}-$TARGET.zip" ;;
              *.exe) out="${base%.exe}-$TARGET.exe" ;;
              *) out="$base-$TARGET" ;;
            esac
            cp "$file" "build/pr/$out"
            echo "${base%%-*}=build/pr/$out" >> "$GITHUB_OUTPUT"
          done

      - name: Upload oth06 for the pull request
        if: ${{ steps.pr.outputs.oth06 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.pr.outputs.oth06 }}
          archive: false
          retention-days: 14

      - name: Upload othpatch for the pull request
        if: ${{ steps.pr.outputs.othpatch }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.pr.outputs.othpatch }}
          archive: false
          retention-days: 14

      - name: Upload the packages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ inputs.packages }}-${{ inputs.platform }}-${{ inputs.target }}
          path: build/packages/
          compression-level: 0

  # The Linux unit tests build and run in this job, in the images. The
  # Windows unit tests that the build job uploads run on Windows.
  test:
    name: Test (${{ inputs.platform }}, ${{ inputs.target }})
    needs: build
    runs-on: ${{ inputs.platform == 'win' && 'windows-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    env:
      OPENTOUHOU_WERROR: 1

    steps:
      - name: Install just
        if: ${{ inputs.platform == 'linux' }}
        uses: taiki-e/install-action@6d97d0d47ea06f0bb4e81bc7911476e7cc61b312 # just

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to the container registry
        if: ${{ inputs.platform == 'linux' }}
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore ccache
        if: ${{ inputs.platform == 'linux' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ccache
          key: ccache-v2-${{ inputs.platform }}-${{ inputs.packages }}-${{ inputs.target }}-${{ hashFiles('justfile', 'tools/docker/pins', 'tools/docker/*/*/Dockerfile', 'tools/docker/win/meson_cross_x86_64.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ inputs.platform }}-${{ inputs.packages }}-${{ inputs.target }}-${{ hashFiles('justfile', 'tools/docker/pins', 'tools/docker/*/*/Dockerfile', 'tools/docker/win/meson_cross_x86_64.txt') }}-

      - name: Run the Linux unit tests
        if: ${{ inputs.platform == 'linux' }}
        env:
          RELEASES_URL: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json', vars.R2_PUBLIC_URL) || '' }}
          PACKAGES: ${{ inputs.packages }}
        run: just test "$PACKAGES"

      - name: Set up Python
        if: ${{ inputs.platform == 'win' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Download the Windows unit tests
        if: ${{ inputs.platform == 'win' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: win-tests-${{ inputs.packages }}-${{ inputs.target }}

      - name: Unpack the Windows unit tests
        if: ${{ inputs.platform == 'win' }}
        run: python -c "import tarfile; tarfile.open('win-tests.tar.zst', 'r:zst').extractall(filter='data')"

      # The tests of the Python tools run on Linux, where the tools run.
      - name: Run the Windows unit tests
        if: ${{ inputs.platform == 'win' }}
        shell: bash
        run: |
          dirs=()
          for dir in build/win/debug build/win/othpatch/debug; do
            if [ -e "$dir/meson-info/intro-tests.json" ]; then
              dirs+=("$dir")
            fi
          done
          python tools/run_tests --no-suite tools "${dirs[@]}"
