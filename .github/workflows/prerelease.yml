name: Publish a development snapshot

# Uploads the game packages and othpatch of each push to develop to
# snapshot/ in the R2 bucket and replaces the snapshot of the release
# index.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A newer push replaces the snapshot, so an older run has nothing to add.
concurrency:
  group: prerelease
  cancel-in-progress: true

# Publishing stays off until the repository variable PRERELEASE_ENABLE
# is set to true.
jobs:
  build_linux:
    name: Linux
    if: vars.PRERELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: release
      release_index_url: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json?run={1}-{2}', vars.R2_PUBLIC_URL, github.run_id, github.run_attempt) || '' }}

  build_win:
    name: Windows
    if: vars.PRERELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: release
      release_index_url: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json?run={1}-{2}', vars.R2_PUBLIC_URL, github.run_id, github.run_attempt) || '' }}

  build_mac:
    name: macOS
    if: vars.PRERELEASE_ENABLE == 'true'
    uses: ./.github/workflows/job_build_macos.yml
    with:
      target: release
      release_index_url: ${{ vars.R2_PUBLIC_URL && format('{0}/releases.json?run={1}-{2}', vars.R2_PUBLIC_URL, github.run_id, github.run_attempt) || '' }}

  publish:
    name: Publish
    needs:
      - build_linux
      - build_win
      - build_mac
    runs-on: ubuntu-latest
    # Every job that writes the index is in this group, so that two
    # writes never overlap.
    concurrency:
      group: release-index
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages/
          merge-multiple: true

      - name: Publish the snapshot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: tools/release_index snapshot --packages packages --commit "$GITHUB_SHA"
