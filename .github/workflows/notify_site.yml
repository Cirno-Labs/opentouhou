name: Tell the site about new releases

# Has the download site read the release index again after a run that
# may have changed it, through its /refresh, which takes the secret
# SITE_REFRESH_TOKEN. Without it, nothing happens, and the site reads the
# index once a day.
on:
  workflow_run:
    workflows:
      - Publish a development snapshot
      - Publish the releases
      - Delete the releases
    types:
      - completed

permissions: {}

jobs:
  notify:
    name: Notify the site
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the site
        env:
          SITE_REFRESH_TOKEN: ${{ secrets.SITE_REFRESH_TOKEN }}
        run: |
          if [ -z "$SITE_REFRESH_TOKEN" ]; then
            echo "SITE_REFRESH_TOKEN is not set; the site reads the index once a day."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "Authorization: Bearer $SITE_REFRESH_TOKEN" \
            https://opentouhou.org/refresh
