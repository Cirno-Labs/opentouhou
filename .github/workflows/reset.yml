name: Delete the releases

# Deletes every release from the R2 bucket: the files under <product>/,
# such as oth06/, and the releases in the index. The snapshot stays.
# The git tags stay; delete them by hand.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to delete every release"
        required: true

permissions:
  contents: read

jobs:
  branch:
    name: Check the branch
    runs-on: ubuntu-latest
    steps:
      - name: Check that the run is on main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::This workflow runs only on main, not on $GITHUB_REF. Run it with --ref main."
            exit 1
          fi

  reset:
    name: Delete the releases
    needs: branch
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    environment: release
    # Every job that writes the index is in this group, so that two
    # writes never overlap.
    concurrency:
      group: release-index
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete the releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: tools/release_index reset

