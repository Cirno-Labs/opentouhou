name: Publish a release

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write
  packages: read

jobs:
  build_linux:
    name: Linux
    uses: ./.github/workflows/job_build.yml
    with:
      platform: linux
      target: release

  build_win:
    name: Windows
    uses: ./.github/workflows/job_build.yml
    with:
      platform: win
      target: release

  build_mac:
    name: macOS
    uses: ./.github/workflows/job_build_macos.yml
    with:
      target: release

  publish:
    name: Publish
    needs:
      - build_linux
      - build_win
      - build_mac
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages/
          merge-multiple: true

      # The tag names the game and its version, as th06-v1.2.0. The
      # notes are that version's section of the game's changelog, which
      # tools/release wrote. Only the tagged game's packages are attached.
      # They are named after its executable: the game id with an o
      # before it, as oth06.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          game="${TAG%-v*}"
          version="${TAG##*-v}"
          tools/output_changelog "$game" "$version" > notes.md
          gh release create "$TAG" \
            --title "$game $version" \
            --notes-file notes.md \
            --verify-tag \
            packages/o"$game"-*
